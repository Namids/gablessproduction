<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Pay or support Gabless Healthcare Consulting securely online or by bank transfer." />
    <title>Payment Portal | Gabless Healthcare Consulting</title>

    <link rel="icon" href="../img/Gabless_title.png">

    <!-- Existing Website CSS -->
    <link rel="stylesheet" href="../css/bootstrap.min.css">
    <link rel="stylesheet" href="../css/font-awesome.min.css">
    <link rel="stylesheet" href="../css/icofont.css">
    <link rel="stylesheet" href="../css/slicknav.min.css">
    <link rel="stylesheet" href="../css/normalize.css">
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="../css/responsive.css">

    <script src="../js/site-config.js"></script>
    <script defer src="../js/loader.js"></script>
</head>

<body>
    <!-- Preloader -->
    <div class="preloader">
      <div class="loader">
        <div class="loader-outter"></div>
        <div class="loader-inner"></div>

        <div class="indicator">
          <svg width="16px" height="12px">
            <polyline id="back" points="1 6 4 6 6 11 10 1 12 6 15 6"></polyline>
            <polyline
              id="front"
              points="1 6 4 6 6 11 10 1 12 6 15 6"></polyline>
          </svg>
        </div>
      </div>
    </div>
    <!-- End Preloader -->

    <!-- Header Area -->
    <div id="header"></div>
    <!-- End Header Area -->


    <section class="payment-section">
        <div class="container">
            <div class="payment-card" id="payCard" data-mode="payment">

                <img src="../img/2.png" alt="Gabless Logo" class="payment-logo">

                <div class="pay-tabs" role="tablist" aria-label="Payment type">
                    <button type="button" class="pay-tab active" data-type="payment" role="tab" aria-selected="true"><i class="fa fa-credit-card"></i> Client Payment</button>
                    <button type="button" class="pay-tab" data-type="support" role="tab" aria-selected="false"><i class="fa fa-heart"></i> Support Us</button>
                </div>

                <div id="payForm">
                    <h2 id="payTitle"></h2>
                    <p class="payment-text" id="payText"></p>

                    <div class="amount-box">
                        <label for="payAmount">Amount (&#8358;)</label>
                        <input type="number" id="payAmount" min="100" step="100" placeholder="0" inputmode="numeric">
                        <div class="quick-amounts only-support" id="quickAmounts">
                            <button type="button" data-amt="5000">&#8358;5,000</button>
                            <button type="button" data-amt="10000">&#8358;10,000</button>
                            <button type="button" data-amt="25000">&#8358;25,000</button>
                            <button type="button" data-amt="50000">&#8358;50,000</button>
                        </div>
                    </div>

                    <div class="payer-fields">
                        <input type="text" id="payerName" placeholder="Full name" autocomplete="name" aria-label="Full name">
                        <input type="email" id="payerEmail" placeholder="Email (for your receipt)" autocomplete="email" aria-label="Email">
                        <input type="text" id="payerRef" class="only-payment full" placeholder="Invoice number (optional)" aria-label="Invoice number">
                    </div>

                    <button type="button" id="payNowBtn" class="btn payment-btn pay-now-btn">
                        <i class="fa fa-lock"></i> <span id="payNowLabel">Pay Now</span>
                    </button>
                    <p class="pay-methods-note"><i class="fa fa-shield"></i> Secure checkout by Flutterwave &middot; Google Pay, card, bank transfer &amp; USSD</p>
                    <div id="pay-status" class="pay-status" role="status" aria-live="polite"></div>

                    <details class="bank-toggle">
                        <summary>Prefer to pay by bank transfer?</summary>
                        <div class="bank-details">
                            <div class="payment-info"><strong>Account Name</strong><p>Gabless Healthcare Consulting</p></div>
                            <div class="payment-info"><strong>Bank Name</strong><p>Zenith Bank</p></div>
                            <div class="account-box" id="accountNumber">0123456789</div>
                            <button type="button" class="btn payment-btn" onclick="copyAccount()">Copy Account Number</button>
                            <p class="transfer-note" id="transferNote"></p>
                        </div>
                    </details>
                </div>

                <div id="paySuccess" class="pay-success" hidden>
                    <div class="pay-success-icon"><i class="fa fa-check"></i></div>
                    <h2 id="successTitle">Thank you!</h2>
                    <p class="payment-text" id="successText"></p>
                    <button type="button" class="btn payment-btn" id="payAgain">Make Another Payment</button>
                </div>

                <a href="../index.html" class="btn home-btn">Back To Homepage</a>

            </div>
        </div>
    </section>

    <!-- Footer Area -->
    <div id="footer"></div>
    <!--/ End Footer Area -->

    <script src="../js/jquery.min.js"></script>
    <script src="../js/jquery-migrate-3.0.0.js"></script>
    <script src="../js/jquery-ui.min.js"></script>
    <script src="../js/easing.js"></script>
    <script src="../js/colors.js"></script>
    <script src="../js/popper.min.js"></script>
    <script src="../js/bootstrap-datepicker.js"></script>
    <script src="../js/jquery.nav.js"></script>
    <script src="../js/slicknav.min.js"></script>
    <script src="../js/jquery.scrollUp.min.js"></script>
    <script src="../js/niceselect.js"></script>
    <script src="../js/tilt.jquery.min.js"></script>
    <script src="../js/owl-carousel.js"></script>
    <script src="../js/jquery.counterup.min.js"></script>
    <script src="../js/steller.js"></script>
    <script src="../js/wow.min.js"></script>
    <script src="../js/jquery.magnific-popup.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/waypoints/2.0.3/waypoints.min.js"></script>
    <script src="../js/bootstrap.min.js"></script>
    <script src="../js/main.js"></script>
    <script src="../js/payment.js"></script>
    <script src="https://checkout.flutterwave.com/v3.js"></script>

</body>

</html>
